<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAVIER</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>
  <div class="grid-overlay"></div>

  <header>
    <div class="header-left">
      <span class="logo">JAVIER</span>
      <span class="tagline">// thought structuring system</span>
    </div>
    <div class="header-right">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">READY</span>
    </div>
  </header>

  <main>

    <!-- LEFT: Tag Browser -->
    <aside class="sidebar">
      <div class="sidebar-label">// TAG BROWSER</div>
      <input type="text" id="tagSearch" placeholder="search tags..." oninput="filterTags()" />
      <div id="tagList" class="tag-list">
        <div class="dim">loading...</div>
      </div>

      <div id="noteList" class="note-list hidden">
        <div class="note-list-header">
          <span id="activeTag"></span>
          <button class="back-btn" onclick="clearNoteList()">← BACK</button>
        </div>
        <div id="noteItems"></div>
      </div>
    </aside>

    <!-- CENTER: Input -->
    <div class="center-block">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="prompt-label">// INPUT THOUGHT</div>
      <textarea
        id="thoughtInput"
        placeholder="dump your thought here..."
        rows="5"
        autofocus
      ></textarea>

      <div class="actions">
        <div class="char-count"><span id="charCount">0</span> CHARS</div>
        <button id="submitBtn" onclick="submitThought()">
          <span id="btnText">STRUCTURE →</span>
        </button>
      </div>
    </div>

    <!-- RIGHT: Log + Note Viewer -->
    <div class="right-panel">

      <div class="panel-tabs">
        <button class="tab active" id="tabLog" onclick="showTab('log')">LOG</button>
        <button class="tab" id="tabNote" onclick="showTab('note')">NOTE</button>
      </div>

      <div id="panelLog" class="panel-content">
        <div id="logOutput">
          <div class="log-entry system">_ system initialized</div>
        </div>
      </div>

      <div id="panelNote" class="panel-content hidden">
        <div class="note-label" id="noteLabel">// NO NOTE SELECTED</div>
        <div id="noteContent" class="note-content"></div>
      </div>

    </div>

  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
